[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "miraihr_core"
authors = [{ name = "MiraiHR" }]
description = "MiraiHR branding extension for Frappe"
requires-python = ">=3.14,<3.15"
readme = "README.md"
dynamic = ["version"]

[tool.bench.frappe-dependencies]
frappe = ">=16.50.0,<17.0.0"
